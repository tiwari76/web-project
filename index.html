<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Voice Cloning</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: #f9fafb;
      color: #1f2937;
    }
    header {
      background-color: #1e3a8a;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }
    header p {
      font-size: 1.1rem;
      margin-top: 10px;
      color: #dbeafe;
    }
    .container {
      max-width: 700px;
      margin: 40px auto;
      background-color: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.07);
    }
    h2 {
      font-size: 1.75rem;
      color: #1e3a8a;
      margin-bottom: 25px;
    }
    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    input[type="file"],
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
    }
    textarea {
      resize: vertical;
      height: 140px;
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 14px 24px;
      margin-top: 25px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    .audio-preview {
      margin-top: 40px;
      text-align: center;
    }
    audio {
      width: 100%;
      margin-top: 15px;
      border-radius: 8px;
    }
    footer {
      text-align: center;
      padding: 20px;
      background-color: #f1f5f9;
      font-size: 0.9rem;
      color: #6b7280;
      margin-top: 60px;
    }
  </style>
</head>
<body>

  <header>
    <h1>AI Voice Cloning</h1>
    <p>Upload your voice and bring text to life with AI technology</p>
  </header>

  <div class="container">
    <h2>Clone Your Voice Instantly</h2>

    <form id="voiceForm">
      <label for="voiceSample">Upload Your Voice Sample</label>
      <input type="file" id="voiceSample" name="voiceSample" accept="audio/*" required>

      <label for="textScript">Enter the Script You Want Spoken</label>
      <textarea id="textScript" name="textScript" placeholder="Type your script here..." required></textarea>

      <button type="submit">Generate Voice</button>
    </form>

    <div class="audio-preview" id="previewSection" style="display:none;">
      <h3>Cloned Voice Output</h3>
      <audio controls id="voiceOutput">
        <source src="" type="audio/mp3">
        Your browser does not support the audio element.
      </audio>
    </div>
  </div>

  <footer>
    &copy; 2025 AI Voice Cloning. All rights reserved.
  </footer>

  <script>
    document.getElementById('voiceForm').addEventListener('submit', function(e) {
      e.preventDefault();

      // Simulated preview functionality
      const preview = document.getElementById('previewSection');
      const audio = document.getElementById('voiceOutput');
      audio.src = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"; // Replace with generated audio URL
      preview.style.display = "block";
    });
  </script>

</body>
</html>
